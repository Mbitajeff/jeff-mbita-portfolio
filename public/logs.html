<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Portfolio Logs — Jeff Mbita</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0f1e;color:#e2e8f0;min-height:100vh;padding:24px 16px}

/* Auth */
.auth{max-width:380px;margin:80px auto;background:#111827;border:1px solid #1e293b;border-radius:14px;padding:32px}
.auth h2{font-size:1.1rem;font-weight:700;margin-bottom:6px;color:#f8fafc}
.auth p{font-size:0.8rem;color:#64748b;margin-bottom:20px}
.field{width:100%;background:#0a0f1e;border:1px solid #1e293b;color:#f8fafc;padding:11px 14px;border-radius:8px;font-size:0.875rem;outline:none;margin-bottom:12px}
.field:focus{border-color:#3b82f6}
.btn{background:#3b82f6;color:#fff;border:none;padding:11px 20px;border-radius:8px;font-size:0.875rem;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;border:1px solid #1e293b;color:#64748b;margin-left:8px}
.btn.ghost:hover{border-color:#3b82f6;color:#3b82f6}
.err{color:#f87171;font-size:0.78rem;margin-top:8px}

/* Dashboard */
#dash{display:none;max-width:1000px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.top h1{font-size:1.2rem;font-weight:700;color:#f8fafc}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field-sm{background:#111827;border:1px solid #1e293b;color:#f8fafc;padding:8px 12px;border-radius:8px;font-size:0.8rem;outline:none;width:200px}
.field-sm:focus{border-color:#3b82f6}

/* Summary cards */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.card{background:#111827;border:1px solid #1e293b;border-radius:10px;padding:14px 16px}
.card .num{font-size:1.5rem;font-weight:700;color:#f8fafc}
.card .lbl{font-size:0.72rem;color:#64748b;margin-top:2px}

/* Session list */
.sessions{display:flex;flex-direction:column;gap:8px}
.session{background:#111827;border:1px solid #1e293b;border-radius:10px;overflow:hidden;transition:border-color .15s}
.session:hover{border-color:#334155}
.session.expanded{border-color:#3b82f6}

/* Session header */
.sh{display:grid;grid-template-columns:180px 1fr 1fr 1fr 60px;gap:8px;align-items:start;padding:14px 16px;cursor:pointer}
@media(max-width:680px){.sh{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto}}
.sh-time{font-size:0.75rem;color:#94a3b8;line-height:1.4}
.sh-who{display:flex;flex-direction:column;gap:4px}
.badge{display:inline-block;padding:2px 9px;border-radius:9999px;font-size:0.68rem;font-weight:600}
.badge-campaign{background:#1d4ed8;color:#bfdbfe}
.badge-direct{background:#1e293b;color:#475569}
.sh-where{font-size:0.8rem;color:#cbd5e1;display:flex;flex-direction:column;gap:2px}
.sh-where .country{font-size:0.72rem;color:#64748b}
.sh-device{font-size:0.72rem;color:#64748b;display:flex;flex-direction:column;gap:2px}
.sh-actions{text-align:center}
.action-count{background:#0a0f1e;color:#94a3b8;padding:3px 10px;border-radius:6px;font-size:0.75rem;font-weight:600}

/* Session body — full timeline */
.sb{border-top:1px solid #1e293b;padding:16px;display:none;animation:fadeIn .15s ease}
.sb.open{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.sb-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.meta-item{background:#0a0f1e;border:1px solid #1e293b;border-radius:8px;padding:10px 12px}
.meta-item .mk{font-size:0.68rem;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.meta-item .mv{font-size:0.8rem;color:#e2e8f0;word-break:break-all}

.timeline{margin-top:4px}
.timeline-title{font-size:0.72rem;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.tl-item{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #0f172a;position:relative}
.tl-item:last-child{border-bottom:none}
.tl-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;shrink:0;flex-shrink:0}
.dot-visit{background:#22c55e}
.dot-click{background:#3b82f6}
.tl-time{font-size:0.72rem;color:#475569;min-width:60px;padding-top:1px}
.tl-content{flex:1}
.tl-type{font-size:0.75rem;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em}
.tl-detail{font-size:0.82rem;color:#38bdf8;margin-top:1px;word-break:break-all}
.tl-path{font-size:0.72rem;color:#475569;margin-top:1px}

.empty{text-align:center;padding:48px;color:#475569;font-size:0.875rem}
.load-err{color:#f87171;text-align:center;padding:20px;font-size:0.85rem}
</style>
</head>
<body>

<!-- Auth screen -->
<div id="auth-screen" class="auth">
  <h2>Portfolio Logs</h2>
  <p>Enter your admin key to view visitor history.</p>
  <input class="field" type="password" id="key-input" placeholder="Admin key" autocomplete="off" />
  <br>
  <button class="btn" onclick="loadLogs()">View logs</button>
  <div id="auth-error" class="err"></div>
</div>

<!-- Dashboard -->
<div id="dash">
  <div class="top">
    <h1>Visitor Logs</h1>
    <div class="toolbar">
      <input class="field-sm" type="text" id="campaign-filter" placeholder="Filter by campaign…" oninput="render()" />
      <button class="btn ghost" onclick="loadLogs()">↻ Refresh</button>
    </div>
  </div>

  <div class="summary" id="summary-cards"></div>
  <div class="sessions" id="sessions-list"></div>
</div>

<script>
let allEvents = [];
let adminKey = '';

document.getElementById('key-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadLogs();
});

async function loadLogs() {
  const input = document.getElementById('key-input');
  const key = input ? input.value.trim() : adminKey;
  if (!key) { document.getElementById('auth-error').textContent = 'Enter your admin key.'; return; }
  adminKey = key;

  try {
    const res = await fetch('/api/logs', { headers: { 'x-admin-key': key } });
    if (res.status === 401) {
      document.getElementById('auth-error').textContent = 'Wrong admin key.';
      return;
    }
    if (!res.ok) {
      document.getElementById('auth-error').textContent = 'Server error. Check Vercel logs.';
      return;
    }
    const data = await res.json();
    allEvents = data.events || [];
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('dash').style.display = 'block';
    render();
  } catch (e) {
    document.getElementById('auth-error').textContent = 'Could not connect to API.';
  }
}

function fmt(iso) {
  return new Date(iso).toLocaleString('en-KE', {
    timeZone: 'Africa/Nairobi',
    dateStyle: 'medium',
    timeStyle: 'short'
  });
}

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString('en-KE', {
    timeZone: 'Africa/Nairobi',
    timeStyle: 'short'
  });
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-KE', {
    timeZone: 'Africa/Nairobi',
    dateStyle: 'medium'
  });
}

function groupSessions(events) {
  const map = new Map();
  for (const ev of events) {
    if (!map.has(ev.sessionId)) map.set(ev.sessionId, []);
    map.get(ev.sessionId).push(ev);
  }
  return [...map.entries()].map(([id, evs]) => {
    evs.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
    const visit = evs.find(e => e.type === 'visit') || evs[0];
    const clicks = evs.filter(e => e.type === 'click');
    return { id, visit, clicks, all: evs };
  }).sort((a, b) => new Date(b.visit.timestamp) - new Date(a.visit.timestamp));
}

function render() {
  const filter = (document.getElementById('campaign-filter').value || '').trim().toLowerCase();
  const sessions = groupSessions(allEvents);
  const filtered = filter
    ? sessions.filter(s => (s.visit.campaign || 'direct').toLowerCase().includes(filter))
    : sessions;

  // Summary cards
  const totalClicks = filtered.reduce((sum, s) => sum + s.clicks.length, 0);
  const campaigns = [...new Set(filtered.map(s => s.visit.campaign).filter(Boolean))];
  const countries = [...new Set(filtered.map(s => s.visit.country).filter(c => c && c !== 'unknown'))];
  document.getElementById('summary-cards').innerHTML = `
    <div class="card"><div class="num">${filtered.length}</div><div class="lbl">Total sessions</div></div>
    <div class="card"><div class="num">${totalClicks}</div><div class="lbl">Total clicks</div></div>
    <div class="card"><div class="num">${campaigns.length || '—'}</div><div class="lbl">Campaigns</div></div>
    <div class="card"><div class="num">${countries.length || '—'}</div><div class="lbl">Countries</div></div>
  `;

  const container = document.getElementById('sessions-list');
  if (!filtered.length) {
    container.innerHTML = '<div class="empty">No sessions yet. Share a tracking link to get started.</div>';
    return;
  }

  container.innerHTML = filtered.map((s, i) => {
    const v = s.visit;
    const campaignBadge = v.campaign
      ? `<span class="badge badge-campaign">${v.campaign}</span>`
      : `<span class="badge badge-direct">direct</span>`;

    const deviceIcon = v.device === 'mobile' ? '📱' : '🖥';
    const clickCount = s.clicks.length;

    // Full timeline: visit + all clicks in order
    const timelineRows = s.all.map(ev => {
      if (ev.type === 'visit') {
        return `
          <div class="tl-item">
            <div class="tl-dot dot-visit"></div>
            <div class="tl-time">${fmtTime(ev.timestamp)}</div>
            <div class="tl-content">
              <div class="tl-type">Page opened</div>
              <div class="tl-detail">${ev.path || '/'}</div>
            </div>
          </div>`;
      }
      return `
        <div class="tl-item">
          <div class="tl-dot dot-click"></div>
          <div class="tl-time">${fmtTime(ev.timestamp)}</div>
          <div class="tl-content">
            <div class="tl-type">Clicked</div>
            <div class="tl-detail">${ev.target || 'unknown'}</div>
            ${ev.path ? `<div class="tl-path">on ${ev.path}</div>` : ''}
          </div>
        </div>`;
    }).join('');

    const ref = v.referrer && v.referrer !== ''
      ? v.referrer
      : 'Direct / none';

    return `
      <div class="session" id="session-${i}">
        <div class="sh" onclick="toggle(${i})">
          <div>
            <div class="sh-time">${fmtDate(v.timestamp)}</div>
            <div class="sh-time">${fmtTime(v.timestamp)} EAT</div>
          </div>
          <div class="sh-who">${campaignBadge}</div>
          <div class="sh-where">
            <span>${v.city || 'Unknown city'}</span>
            <span class="country">${v.country || '?'}</span>
          </div>
          <div class="sh-device">
            <span>${deviceIcon} ${v.device || '?'}</span>
          </div>
          <div class="sh-actions">
            <div class="action-count">${clickCount} action${clickCount !== 1 ? 's' : ''}</div>
          </div>
        </div>
        <div class="sb" id="sb-${i}">
          <div class="sb-meta">
            <div class="meta-item">
              <div class="mk">Campaign / Source</div>
              <div class="mv">${v.campaign || 'Direct visit'}</div>
            </div>
            <div class="meta-item">
              <div class="mk">Location</div>
              <div class="mv">${v.city || '?'}, ${v.country || '?'}</div>
            </div>
            <div class="meta-item">
              <div class="mk">Device</div>
              <div class="mv">${deviceIcon} ${v.device || 'Unknown'}</div>
            </div>
            <div class="meta-item">
              <div class="mk">Came from</div>
              <div class="mv">${ref}</div>
            </div>
            <div class="meta-item">
              <div class="mk">Session ID</div>
              <div class="mv" style="font-size:0.68rem;color:#475569">${s.id}</div>
            </div>
            <div class="meta-item">
              <div class="mk">Total actions</div>
              <div class="mv">${s.all.length} (${clickCount} clicks)</div>
            </div>
          </div>
          <div class="timeline">
            <div class="timeline-title">Full session timeline</div>
            ${timelineRows}
          </div>
        </div>
      </div>`;
  }).join('');
}

function toggle(i) {
  const sb = document.getElementById(`sb-${i}`);
  const session = document.getElementById(`session-${i}`);
  const isOpen = sb.classList.contains('open');
  sb.classList.toggle('open', !isOpen);
  session.classList.toggle('expanded', !isOpen);
}
</script>
</body>
</html>
